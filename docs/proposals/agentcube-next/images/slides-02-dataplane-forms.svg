<text x="327" y="358" font-size="10.5" fill="#343a40" text-anchor="middle">Pod IP（CNI）</text>
<text x="327" y="374" font-size="10.5" fill="#343a40" text-anchor="middle">自己的 cgroup</text>
<path d="M327 218 L327 236" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#head)"/>
<text x="200" y="414" font-size="11.5" fill="#343a40" text-anchor="middle">每个 Pod 由 kube-scheduler 放置、kubelet 拉起</text>
<text x="200" y="434" font-size="11.5" fill="#343a40" text-anchor="middle">隔离强度取决于 RuntimeClass</text>
<text x="200" y="484" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">访问：Router → PodIP:端口</text>
<rect x="406" y="6" width="388" height="48" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="600.0" y="27.4" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">形态 B：占位 Pod + Kata（或开源 Kuasar）</text>
<text x="600.0" y="44.0" font-size="11.5" fill="#343a40" text-anchor="middle">经 containerd 直接起 microVM，没有快照管理；计划的第一版</text>
<rect x="406" y="60" width="388" height="94" rx="4" fill="#fafbfc" stroke="#dee2e6" stroke-width="1"/>
<text x="416" y="76" font-size="11" fill="#5c6670" text-anchor="start" font-weight="bold">集群一侧</text>
<rect x="416" y="82" width="368" height="28" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="600.0" y="100.6" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">池控制器：独立的 Deployment（新增，建议）</text>
<text x="416" y="127" font-size="11.5" fill="#343a40" text-anchor="start">SandboxPoolClass → 每节点一个 SandboxPool + 占位 Pod</text>
<text x="416" y="144" font-size="11.5" fill="#343a40" text-anchor="start">每沙箱：没有 Kubernetes 对象</text>
<rect x="406" y="160" width="388" height="330" rx="4" fill="#fafbfc" stroke="#dee2e6" stroke-width="1"/>
<text x="416" y="177" font-size="11.5" fill="#5c6670" text-anchor="start" font-weight="bold">节点：Kubernetes 节点，要 /dev/kvm</text>
<rect x="406" y="496" width="388" height="118" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/>
<text x="416" y="514" font-size="12" fill="#212529" text-anchor="start" font-weight="bold">部署要点</text>
<text x="416" y="535" font-size="11.5" fill="#343a40" text-anchor="start">• 节点新增：placeholder-agent、节点适配器、Kata 和 VMM</text>
<text x="416" y="555" font-size="11.5" fill="#343a40" text-anchor="start">• 沙箱不是 Pod；按设计不在占位 Pod 的 cgroup 下</text>
<text x="416" y="575" font-size="11.5" fill="#343a40" text-anchor="start">• 沙箱内容就是 OCI 镜像；每次创建都是冷启动</text>
<text x="416" y="595" font-size="11.5" fill="#343a40" text-anchor="start">• 账本、准入、开销、网络都由节点适配器负责</text>
<rect x="416" y="186" width="176" height="58" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
<text x="504.0" y="204.4" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">占位 Pod（每节点一个）</text>
<text x="504.0" y="219.9" font-size="11" fill="#343a40" text-anchor="middle">pause 或空操作 shim</text>
<text x="504.0" y="235.1" font-size="11" fill="#343a40" text-anchor="middle">requests = 池大小，只记账</text>
<rect x="602" y="186" width="182" height="58" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="693.0" y="204.4" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">placeholder-agent</text>
<text x="693.0" y="219.9" font-size="11" fill="#343a40" text-anchor="middle">DaemonSet（建议）</text>
<text x="693.0" y="235.1" font-size="11" fill="#343a40" text-anchor="middle">读占位 Pod，写池状态与 /resize</text>
<path d="M693 244 L693 264" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#head)"/>
<text x="685" y="258" font-size="10" fill="#5c6670" text-anchor="end">容量接口（本地 socket）</text>
<rect x="416" y="264" width="368" height="64" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="600.0" y="285.4" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">节点适配器：宿主机服务或特权 DaemonSet，待定</text>
<text x="600.0" y="300.9" font-size="11" fill="#343a40" text-anchor="middle">池的账本 · 准入 · 每沙箱 cgroup · 网络命名空间</text>
<text x="600.0" y="316.1" font-size="11" fill="#5c6670" text-anchor="middle">WorkloadManager 经 gRPC + mTLS 直接调用</text>
<path d="M600 328 L600 338" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#head)"/>
