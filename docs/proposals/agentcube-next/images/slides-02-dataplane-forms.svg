<text x="200.0" y="100.6" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">agent-sandbox 控制器：Deployment，需另行安装</text>
<text x="16" y="127" font-size="11.5" fill="#343a40" text-anchor="start">每沙箱：Sandbox（预热时加 SandboxClaim）→ Pod</text>
<text x="16" y="144" font-size="11.5" fill="#343a40" text-anchor="start">预热：SandboxWarmPool 预建 Pod</text>
<rect x="6" y="160" width="388" height="330" rx="4" fill="#fafbfc" stroke="#dee2e6" stroke-width="1"/>
<text x="16" y="177" font-size="11.5" fill="#5c6670" text-anchor="start" font-weight="bold">节点：普通 Kubernetes 节点，不装 AgentCube 的部件</text>
<rect x="6" y="496" width="388" height="118" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/>
<text x="16" y="514" font-size="12" fill="#212529" text-anchor="start" font-weight="bold">部署要点</text>
<text x="16" y="535" font-size="11.5" fill="#343a40" text-anchor="start">• 节点上不新增部件，控制器装在集群里</text>
<text x="16" y="555" font-size="11.5" fill="#343a40" text-anchor="start">• 每个沙箱 = 一个 Sandbox 对象 + 一个 Pod</text>
<text x="16" y="575" font-size="11.5" fill="#343a40" text-anchor="start">• 要 microVM 隔离：节点装 Kata，用 RuntimeClass 选</text>
<text x="16" y="595" font-size="11.5" fill="#343a40" text-anchor="start">• 预热 = 预先建好的 Pod，占着真实的 requests</text>
<rect x="16" y="188" width="70" height="30" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
<text x="51.0" y="207.4" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">kubelet</text>
<rect x="100" y="188" width="132" height="30" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
<text x="166.0" y="207.4" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">containerd（CRI）</text>
<rect x="246" y="188" width="138" height="30" rx="6" fill="#fff1e0" stroke="#e08a1e" stroke-width="1.2"/>
<text x="315.0" y="207.4" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">runc / gVisor / Kata</text>
