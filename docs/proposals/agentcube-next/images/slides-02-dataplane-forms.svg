<rect x="824" y="337" width="172" height="92" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="910.0" y="358.4" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">kuasar-sandbox</text>
<text x="910.0" y="373.2" font-size="10.5" fill="#343a40" text-anchor="middle">conductor（账本、准入）</text>
<text x="910.0" y="387.7" font-size="10.5" fill="#343a40" text-anchor="middle">Proxy（数据入口）· connector</text>
<text x="910.0" y="402.2" font-size="10.5" fill="#343a40" text-anchor="middle">每沙箱 sandbox-ctl + CH</text>
<text x="910.0" y="416.7" font-size="10.5" fill="#343a40" text-anchor="middle">模板构建也在节点上</text>
<rect x="1004" y="337" width="172" height="92" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
<text x="1090.0" y="358.4" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">CubeSandbox</text>
<text x="1090.0" y="373.2" font-size="10.5" fill="#343a40" text-anchor="middle">Cubelet（内嵌 containerd）</text>
<text x="1090.0" y="387.7" font-size="10.5" fill="#343a40" text-anchor="middle">CubeVS · CubeEgress（网络）</text>
<text x="1090.0" y="402.2" font-size="10.5" fill="#343a40" text-anchor="middle">每沙箱 CubeShim + VMM</text>
<text x="1090.0" y="416.7" font-size="10.5" fill="#b3541e" text-anchor="middle">准入、入口、模板构建在集群层</text>
