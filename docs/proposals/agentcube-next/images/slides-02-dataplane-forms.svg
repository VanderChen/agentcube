<rect x="816" y="264" width="368" height="40" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="1000.0" y="281.0" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">节点适配器</text>
<text x="1000.0" y="296.5" font-size="11" fill="#343a40" text-anchor="middle">只翻译接口；账本与准入要由节点栈做</text>
