<text x="600.0" y="356.1" font-size="11.5" fill="#343a40" text-anchor="middle">containerd：独立 namespace，kubelet 不管这些沙箱</text>
<text x="600.0" y="370.9" font-size="10.5" fill="#5c6670" text-anchor="middle">用 kubelet 的实例还是专用实例待定；互不干扰待验证</text>
<path d="M600 380 L600 390" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#head)"/>
