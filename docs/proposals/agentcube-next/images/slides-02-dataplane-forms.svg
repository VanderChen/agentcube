<text x="480.0" y="449.3" font-size="10.5" fill="#343a40" text-anchor="middle">Kata shim + VMM</text>
<rect x="544" y="412" width="112" height="50" rx="6" fill="#f3ebff" stroke="#7b55c7" stroke-width="1.2"/>
