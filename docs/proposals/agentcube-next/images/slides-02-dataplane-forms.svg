<text x="200.0" y="314.3" font-size="11" fill="#343a40" text-anchor="middle">业务容器</text>
<text x="200.0" y="328.4" font-size="10" fill="#5c6670" text-anchor="middle">PicoD 或 agent</text>
<text x="200" y="358" font-size="10.5" fill="#343a40" text-anchor="middle">Pod IP（CNI）</text>
<text x="200" y="374" font-size="10.5" fill="#343a40" text-anchor="middle">自己的 cgroup</text>
