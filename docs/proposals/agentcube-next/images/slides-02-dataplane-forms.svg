<text x="720.0" y="449.3" font-size="10.5" fill="#343a40" text-anchor="middle">Kata shim + VMM</text>
<text x="600" y="484" font-size="11.5" fill="#212529" text-anchor="middle" font-weight="bold">访问：第一版只在节点上可达，第二版自建数据入口</text>
<rect x="806" y="6" width="388" height="48" rx="6" fill="#fff1e0" stroke="#e08a1e" stroke-width="1.2"/>
<text x="1000.0" y="27.4" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">形态 C：占位 Pod + kuasar-sandbox / CubeSandbox</text>
<text x="1000.0" y="44.0" font-size="11.5" fill="#343a40" text-anchor="middle">带模板快照和暂停恢复的节点栈；第二种运行时的候选</text>
<rect x="806" y="60" width="388" height="94" rx="4" fill="#fafbfc" stroke="#dee2e6" stroke-width="1"/>
<text x="816" y="76" font-size="11" fill="#5c6670" text-anchor="start" font-weight="bold">集群一侧</text>
<rect x="816" y="82" width="368" height="28" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="1000.0" y="100.6" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">池控制器：独立的 Deployment（同形态 B）</text>
<text x="816" y="127" font-size="11.5" fill="#343a40" text-anchor="start">池对象与占位 Pod 同形态 B；每沙箱没有 Kubernetes 对象</text>
<text x="816" y="144" font-size="11.5" fill="#343a40" text-anchor="start">不用运行时自带的集群控制面</text>
<rect x="806" y="160" width="388" height="330" rx="4" fill="#fafbfc" stroke="#dee2e6" stroke-width="1"/>
<text x="816" y="177" font-size="11.5" fill="#5c6670" text-anchor="start" font-weight="bold">节点：Kubernetes 节点，要 /dev/kvm</text>
<rect x="806" y="496" width="388" height="118" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/>
<text x="816" y="514" font-size="12" fill="#212529" text-anchor="start" font-weight="bold">部署要点</text>
<text x="816" y="535" font-size="11.5" fill="#343a40" text-anchor="start">• 节点新增：placeholder-agent、节点适配器、整套节点栈</text>
<text x="816" y="555" font-size="11.5" fill="#343a40" text-anchor="start">• kuasar-sandbox：账本、快照、网络、数据入口都在节点上</text>
<text x="816" y="575" font-size="11.5" fill="#343a40" text-anchor="start">• CubeSandbox：准入、入口、模板构建在集群层，要另补</text>
<text x="816" y="595" font-size="11.5" fill="#343a40" text-anchor="start">• 与 Kubernetes 节点共存的形态还没有验证</text>
<rect x="816" y="186" width="176" height="58" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
<text x="904.0" y="204.4" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">占位 Pod（每节点一个）</text>
<text x="904.0" y="219.9" font-size="11" fill="#343a40" text-anchor="middle">pause 或空操作 shim</text>
<text x="904.0" y="235.1" font-size="11" fill="#343a40" text-anchor="middle">requests = 池大小，只记账</text>
<rect x="1002" y="186" width="182" height="58" rx="6" fill="#e6f6ec" stroke="#2f9e55" stroke-width="1.2"/>
<text x="1093.0" y="204.4" font-size="12" fill="#212529" text-anchor="middle" font-weight="bold">placeholder-agent</text>
<text x="1093.0" y="219.9" font-size="11" fill="#343a40" text-anchor="middle">DaemonSet（建议）</text>
<text x="1093.0" y="235.1" font-size="11" fill="#343a40" text-anchor="middle">读占位 Pod，写池状态与 /resize</text>
<path d="M1093 244 L1093 264" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#head)"/>
